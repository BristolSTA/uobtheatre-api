name: "Email Smoke Checks"

# Tests in a production-like environment using Testmail.app to verify email delivery.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  test-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@master

      - name: Build production services 🏗
        run: docker compose -f production.yml build
      
      - name: Run email smoke tests 🧪
        env:
          BASE_URL: https://uobtheatre.com
          EMAIL_ENABLED: true
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_STORAGE_BUCKET_NAME: ${{ secrets.AWS_STORAGE_BUCKET }}
          CELERY_QUEUE_PREFIX: ${{ secrets.CELERY_QUEUE_PREFIX }}
          TESTMAIL_NAMESPACE: ${{ secrets.TESTMAIL_NAMESPACE }}
          TESTMAIL_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: >
          docker compose -f production.yml run --rm api
          python manage.py test_email
          --namespace $TESTMAIL_NAMESPACE
          --tag $TESTMAIL_TAG
          --expect-aws
