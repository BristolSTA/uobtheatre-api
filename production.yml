volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}

# This is a REPLICA of the production deployment setup, which is itself on the sta-compose repo
# This allows for local production-like testing, if you have the right keys

services:
  api:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: uobtheatre_production_django
    depends_on:
      - postgres
    env_file:
      - .env
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    ports:
      - '8000:5000'
    command: /start

  postgres:
    image: postgres:16
    volumes:
      - production_postgres_data:/var/lib/postgresql/data:Z
      - production_postgres_data_backups:/backups:z
    env_file:
      - .env
      - ./.envs/.production/.postgres

  celery:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: uobtheatre_production_celery
    command: celery -A config worker -l info
    env_file:
      - .env
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres