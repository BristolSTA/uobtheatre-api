volumes:
  uobtheatre_local_postgres_data: {}
  uobtheatre_local_postgres_data_backups: {}

services:
  api:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    container_name: uobtheatre-api
    depends_on:
      - postgres
    volumes:
      - .:/app/uobtheatre-api:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
      - path: .env
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    image: postgres:16
    container_name: uobtheatre-postgres
    volumes:
      - uobtheatre_local_postgres_data:/var/lib/postgresql/data:Z
      - uobtheatre_local_postgres_data_backups:/backups:z
    env_file:
      - ./.envs/.local/.postgres
      - path: .env
        required: false

  celery:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    command: celery -A config worker -l debug
    volumes:
      - .:/app/uobtheatre-api:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
      - path: .env
        required: false
    depends_on:
      - redis

  redis:
    image: redis:alpine
    # Locally, redis acts as a task scheduler for celery
    # On production, AWS's SQS is used instead
