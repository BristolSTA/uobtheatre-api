<table width="100%" height="100%" border="0" cellpadding="10" cellspacing="0" role="presentation" style="word-break: break-word;">
  <tr>
    <td class="pad-sml">
      {% if inline %}
        <p>
          {% if title %}
            <strong>
              {% if titleIcon %}
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true" focusable="false" viewBox="0 0 512 512">
                  <path fill="currentColor" d="{{titleIcon}}"/>
                </svg>
              {% endif %}
              {{title}}
            </strong>
          {% endif %}
          {% if messageIcon %}
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true" focusable="false" viewBox="0 0 512 512">
              <path fill="currentColor" d="{{messageIcon}}"/>
            </svg>
          {% endif %}
          {{message}}
        </p>
      {% else %}
        {% if title %}
          <h4 style="padding-bottom: 4px">
            {% if titleIcon %}
              <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true" focusable="false" viewBox="0 0 512 512">
                <path fill="currentColor" d="{{titleIcon}}"/>
              </svg>
            {% endif %}
            {{title}}
          </h4>
        {% endif %}
        <p>
          {% if messageIcon %}
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" aria-hidden="true" focusable="false" viewBox="0 0 512 512">
              <path fill="currentColor" d="{{messageIcon}}"/>
            </svg>
          {% endif %}
          {{message}}
        </p>
      {% endif %}
    </td>
  </tr>
</table>
