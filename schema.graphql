}

"""
The Relay compliant `PageInfo` type, containing data necessary to paginate this connection.
"""
type PageInfo {
  """When paginating forwards, are there more items?"""
  hasNextPage: Boolean!

  """When paginating backwards, are there more items?"""
  hasPreviousPage: Boolean!

  """When paginating backwards, the cursor to continue."""
  startCursor: String

  """When paginating forwards, the cursor to continue."""
  endCursor: String
}

"""A Relay edge containing a `SiteMessageNode` and its cursor."""
type SiteMessageNodeEdge {
  """The item at the end of the edge"""
  node: SiteMessageNode

  """A cursor for use in pagination"""
  cursor: String!
}

type SiteMessageNode implements Node {
  """The ID of the object"""
  id: ID!

  """The message displayed in the body of the banner."""
  message: String!

  """
  Whether the message is active. Inactive messages will not be displayed, even if display_start is in the past.
  """
  active: Boolean!

  """
  If True, the message will be displayed without a Date/Time/Duration if it is ongoing, and without a duration if it is in the future. In addition, it will continue to display even after the event_end until either active or indefinite_override is set to False.
  """
  indefiniteOverride: Boolean!

  """
  When the message should start being displayed on the website. Used to schedule messages in advance, and to determine whether the message should be displayed.
  """
  displayStart: DateTime!

  """
  When the event will start. Used both to calculate duration, and displayed when in banner display location.
  """
  eventStart: DateTime!

  """
  When the event will end. Used both to calculate duration, which is displayed when in banner display location, and to determine whether the message should be displayed.
  """
  eventEnd: DateTime!

  """
  The type of message, which informs how it is displayed. Maintenance messages are displayed in yellow if upcoming, red if ongoing. Information messages are displayed in yellow information text. Alert messages are displayed in red text.
  """
  type: SiteMessagesMessageTypeChoices!

  """
  The policy for a message's dismissal. By default messages are dismissible, and once a message has been dismissed by a user, it will never reappear for them. Single-Session Only messages can be dismissed, but will reappear whenever the page is loaded. Prevented messages cannot be dismissed by the user: if used for a modal, this will essentially shut down that function (or the whole site, for a sitewide modal).
  """
  dismissalPolicy: SiteMessagesMessageDismissalPolicyChoices!

  """
  The location on the site where the message should be displayed. Banner messages are displayed in a banner at the top of the page. Sitewide Modal messages are displayed across the entire website. Booking Modal messages are displayed in a modal on the booking page. Production Creation/Edit Modal messages are displayed in a modal on the production creation and editing page.
  """
  displayLocation: SiteMessagesMessageDisplayLocationChoices!

  """
  A title for the message. Displayed prominently in modals. If used in a banner, it will override the default title based on message type (e.g. Urgent Future Alert).
  """
  title: String
  eventDuration: Int
  toDisplay: Boolean
  creator: ExtendedUserNode
}

"""An object with an ID"""
interface Node {
  """The ID of the object"""
  id: ID!
}

