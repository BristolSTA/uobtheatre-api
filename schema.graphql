  """Maintenance"""
  MAINTENANCE

  """Information"""
  INFORMATION

  """Alert"""
  ALERT
}

"""An enumeration."""
enum SiteMessagesMessageDismissalPolicyChoices {
  """Dismissable (Default)"""
  DEFAULT

  """Single-Session Only"""
  SINGLE

  """Prevented"""
  BANNED
}

"""An enumeration."""
enum SiteMessagesMessageDisplayLocationChoices {
  """Banner"""
  BANNER

  """Sitewide Modal"""
  SITEWIDE_MODAL

  """Booking Modal"""
  BOOKING_MODAL

  """Production Creation/Edit Modal"""
  PRODUCTION_CREATION_MODAL
}

